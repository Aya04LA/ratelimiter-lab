[project]
name = "ratelimiter-lab"
version = "1.0.0"
description = "Four rate-limiting algorithms backed by atomic Redis Lua scripts, with a live visual demo."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
